<!DOCTYPE html>
<!--
  Not a page. Netlify Forms detects forms by scanning static HTML at deploy
  time, and the real contact form (app/contact/page.tsx) is rendered by React,
  so this file declares the "contact" form and its fields for Netlify.
  The contact page submits to this path with fetch. Keep the field names here
  in step with the form in app/contact/page.tsx.
-->
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Contact form</title></head>
<body>
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact">
  <input name="bot-field">
  <input name="name">
  <input type="email" name="email">
  <input type="tel" name="phone">
  <input name="service">
  <textarea name="message"></textarea>
</form>
</body>
</html>
